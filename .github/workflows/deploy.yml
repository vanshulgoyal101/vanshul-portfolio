# .github/workflows/deploy.yml
name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, feature/theme-improvements ]
  workflow_dispatch:

# Least privilege: the build runs npm install scripts, so only the deploy job
# may publish to Pages.
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      indexnow: ${{ steps.indexnow.outputs.payload }}
    # Slow steps carry their own, shorter timeouts so a stall fails the step
    # (and reports) instead of cancelling the whole job.
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency security audit
        run: npm audit --audit-level=moderate

      - name: Lint
        run: npm run lint

      - name: Test and enforce coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOATCOUNTER_CODE: ${{ secrets.VITE_GOATCOUNTER_CODE }}

      - name: Verify published routes
        run: npm run verify:build

      # Compares the new sitemap with the live one while the old build is still
      # deployed; the deploy job submits the changed URLs once they are live.
      - name: Plan IndexNow submission
        id: indexnow
        if: github.ref == 'refs/heads/main'
        run: node scripts/indexnow-plan.mjs

      - name: Install test browser
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium

      - name: Browser regression tests
        timeout-minutes: 15
        run: npm run test:e2e

      - name: Setup Pages
        uses: actions/configure-pages@v6
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'
          
  deploy:
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # Tells Bing, Yandex, Seznam, Naver and Yep which URLs changed. A failure
      # here never fails the deploy, which has already succeeded.
      - name: Notify search engines (IndexNow)
        if: needs.build.outputs.indexnow != ''
        continue-on-error: true
        env:
          PAYLOAD: ${{ needs.build.outputs.indexnow }}
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST 'https://api.indexnow.org/indexnow' \
            -H 'Content-Type: application/json; charset=utf-8' --data "$PAYLOAD")
          echo "IndexNow answered HTTP $status"
          test "$status" = 200 || test "$status" = 202
